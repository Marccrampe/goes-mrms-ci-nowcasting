[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goes-mrms-ci-nowcasting"
version = "0.1.0"
description = "GOES–MRMS convective-initiation nowcasting research workflows"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2", "pandas>=2.2,<3"]

[project.optional-dependencies]
demo = ["matplotlib>=3.9,<4", "ipywidgets>=8,<9", "ipython>=8"]
model = ["torch>=2.2,<3", "zarr>=2.18,<3", "numcodecs>=0.12,<0.16"]
pipeline = [
  "torch>=2.2,<3", "zarr>=2.18,<3", "numcodecs>=0.12,<0.16",
  "pyarrow>=16", "xarray>=2024.7", "dask[array]>=2024.8", "requests>=2.31",
  "s3fs", "pyproj>=3.6", "pyresample>=1.31", "satpy>=0.51", "netCDF4>=1.7",
  "h5netcdf", "cfgrib>=0.9.14", "eccodes>=2.38", "opencv-python-headless>=4.10",
  "matplotlib>=3.9,<4", "tqdm", "Pillow"
]

[project.urls]
Repository = "https://github.com/Marccrampe/goes-mrms-ci-nowcasting"

[tool.setuptools.packages.find]
include = ["ci_nowcasting*", "models*", "verification*", "preprocessing*", "catalogue*", "experiments*"]

# Use the source checkout for workflow files and released example/weights.
# A standalone wheel is not the paper distribution.
